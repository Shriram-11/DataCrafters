[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "datacrafters"
version = "0.1.0"
description = "FastAPI-based ephemeral CSV processing platform"
authors = [{name = "DataCrafters Team"}]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104"
uvicorn = {version = "^0.24", extras = ["standard"]}
pydantic = "^2.0"
pydantic-settings = "^2.0"
polars = "^0.19"
pandas = "^2.0"
duckdb = "^0.9"
pyarrow = "^13.0"
python-multipart = "^0.0.6"
structlog = "^23.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
httpx = "^0.24"
black = "^23.10"
ruff = "^0.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
